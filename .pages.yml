# Existing-content editor. Layout, routes and publishing controls remain in code.
# Preserve omitted publication/legacy metadata with settings.content.merge.
media:
  - name: images
    label: Image library
    input: public/images
    output: /images
    extensions:
      - jpg
      - jpeg
      - png
      - webp
      - svg
      - avif
    rename: safe
